name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verify Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux audio build dependency
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libasound2-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Run repository verification
        run: scripts/verify.sh

  check-desktop:
    name: Check ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Apple Silicon macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Run display-free desktop smoke
        run: cargo run -p dreadstep-bevy --features desktop --bin dreadstep --locked -- --smoke --seed 7 --log-dir target/dreadstep-ci-logs
